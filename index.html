<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM MAXIS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAXIS">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tokens: Encre, Papier, Signal, Béton, Filet (charte MAXIS). */
:root{--bg:#F4F3EF;--fg:#0A0A0A;--muted:#6B6B66;--line:#DCDBD6;--surface:#FFFFFF;--hover:#ECEBE6;--accent:#FF4D1A;--accent-fg:#0A0A0A;--shadow:0 1px 0 rgba(10,10,10,.06);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--fg:#F4F3EF;--muted:#8F8F89;--line:#2B2B29;--surface:#151514;--hover:#1C1C1B;--accent:#FF4D1A;--accent-fg:#0A0A0A;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A0A;--fg:#F4F3EF;--muted:#8F8F89;--line:#2B2B29;--surface:#151514;--hover:#1C1C1B;--accent:#FF4D1A;--accent-fg:#0A0A0A;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

/* Barre du haut : verre dépoli, pastille Signal qui glisse d'un onglet à l'autre */
:root{--ease:cubic-bezier(.22,1,.36,1);--glass:color-mix(in srgb,var(--bg) 80%,transparent)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-top:12px}
.bar-in{display:flex;align-items:center;gap:10px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:2px solid var(--fg);padding:7px 8px;animation:barIn .9s var(--ease) both}
@keyframes barIn{from{opacity:0;transform:translateY(-18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.logo{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:2px 8px 2px 4px;color:var(--fg);flex:none}
.logo svg{width:30px;height:30px;transition:transform .7s var(--ease)}
.logo:hover svg{transform:rotate(90deg) scale(1.08)}
.logo span{font-weight:900;font-stretch:75%;font-size:20px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.nav{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;z-index:1;background:none;border:0;color:var(--muted);padding:12px 13px;font:500 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;cursor:pointer;transition:color .3s}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--accent-fg)}
.nav .ind{position:absolute;z-index:0;top:50%;height:38px;margin-top:-19px;left:0;width:0;background:var(--accent)}
.nav .ind.ready{transition:left .55s var(--ease),width .55s var(--ease)}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.kbar{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--line);padding:9px 10px;color:var(--muted);font:500 12px/1 "IBM Plex Mono",monospace;cursor:pointer;transition:border-color .25s,color .25s}
.kbar:hover{border-color:var(--fg);color:var(--fg)}
.kbar kbd{font:inherit;font-size:10px;border:1px solid currentColor;padding:2px 5px}
.icb{position:relative;width:38px;height:38px;display:inline-grid;place-items:center;background:transparent;border:1px solid var(--line);cursor:pointer;font-size:16px;line-height:1;transition:border-color .25s,transform .4s var(--ease)}
.icb:hover{border-color:var(--fg);transform:translateY(-2px)}
.icb i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--accent);color:var(--accent-fg);font:700 10px/18px "IBM Plex Mono",monospace;font-style:normal;text-align:center}
.icb i[hidden]{display:none}
@media (max-width:980px){.kbar span,.kbar kbd{display:none}.kbar{padding:10px}.logo span{display:none}}
@media (max-width:760px){.bar-in{flex-wrap:wrap;gap:6px 8px}.logo{order:1}.tools{order:2;margin-left:auto}.nav{order:3;flex:1 0 100%}}
@media (max-width:640px){.tools .btn{display:none}}
main{padding-top:6px}

/* Type */
h1{font-weight:900;font-stretch:75%;font-size:clamp(36px,7vw,64px);line-height:.92;text-transform:uppercase;margin:26px 0 8px;text-wrap:balance;letter-spacing:-.01em}
h2{font-weight:800;font-stretch:75%;font-size:18px;text-transform:uppercase;margin:0;letter-spacing:.02em}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
.label{font:500 11px/1.4 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.late{color:var(--accent);font-weight:700}
.sub{margin-top:8px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--fg);padding-bottom:8px;margin-bottom:4px}

/* Blocks */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;border-top:2px solid var(--fg);margin-bottom:28px}
.kpi{padding:16px 16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi b{display:block;font-size:34px;font-weight:900;font-stretch:75%;font-variant-numeric:tabular-nums;margin-top:8px;line-height:1;overflow-wrap:anywhere}
.kpi.hot{background:var(--accent);color:var(--accent-fg)}
.kpi.hot .label{color:var(--accent-fg)}
.split{display:grid;grid-template-columns:1fr;gap:32px}
@media (min-width:880px){.split{grid-template-columns:1.25fr 1fr}}
.split>section{min-width:0}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.row>div{min-width:0}
.row strong{font-weight:700;overflow-wrap:anywhere}
.clickable{cursor:pointer}
.clickable:hover{background:var(--hover)}
.btn{font:700 13px/1 "Archivo",sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;background:var(--fg);color:var(--bg);border:1px solid var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{padding:8px 10px;font-size:12px}
.btn.danger{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.danger[data-armed]{background:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;font:500 11px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em;padding:5px 7px;border:1px solid var(--fg);white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pill.off{border-color:var(--line);color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font:500 10px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;background:var(--hover);color:var(--fg)}

input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);padding:10px 11px;border-radius:0;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--fg);outline:none}
textarea{min-height:88px;resize:vertical}
.form{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.form.two{grid-template-columns:1fr 1fr}}
.full{grid-column:1/-1}
.f{display:grid;gap:6px;min-width:0}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline>*{flex:1 1 150px;min-width:0}
.inline>.btn,.inline>.fit{flex:0 0 auto}
.search{position:relative}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0 0 16px}
.toolbar>*{flex:1 1 180px;min-width:0}
.toolbar>.btn{flex:0 0 auto}

.tbl{overflow-x:auto;border-top:2px solid var(--fg)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font:500 11px/1.4 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.clickable td{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
.r{text-align:right}

.empty{border:1px dashed var(--muted);padding:26px;color:var(--muted);max-width:66ch}
.empty h2{color:var(--fg);margin-bottom:8px}

/* Pipeline */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);overflow-x:auto;border-top:2px solid var(--fg);border-bottom:1px solid var(--line)}
.col{border-right:1px solid var(--line);padding:12px;min-width:0;min-height:260px}
.col.over{background:var(--hover)}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);padding:12px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow)}
.card:hover{border-color:var(--fg)}
.card.late{border-left:4px solid var(--accent)}
.card strong{display:block;font-weight:700;overflow-wrap:anywhere}
.card select{margin-top:10px;font-size:13px;padding:7px}

/* Dialog */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:700px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:840px;max-height:92vh;overflow-y:auto;border:2px solid var(--fg);padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:12px;margin-bottom:4px}
.sheet-h h2{font-size:26px;overflow-wrap:anywhere}
.sec{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.sec>.label{margin:0 0 10px}
.add{margin-top:12px;padding:12px;border:1px solid var(--line)}
.box{display:grid;gap:10px;padding:12px;border:1px dashed var(--muted);margin-bottom:12px}

/* Documents */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.doc{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.doc strong{overflow-wrap:anywhere}
.doc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* Charts */
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:170px;border-bottom:2px solid var(--fg);padding-bottom:0}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar i{display:block;width:100%;background:var(--fg);min-height:2px}
.bar.cur i{background:var(--accent)}
.bar span{font:500 10px/1 "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--muted);margin-top:6px;white-space:nowrap}
.bar em{font:500 10px/1 "IBM Plex Mono",monospace;font-style:normal;margin-bottom:6px;white-space:nowrap}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px);z-index:30}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;font-size:13px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.foot{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Devis & factures : lignes et totaux */
.line{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 76px 110px 110px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.line input{padding:8px 9px}
.line .lm{text-align:right;white-space:nowrap}
.line-h{padding:0 0 6px;border-bottom:1px solid var(--fg)}
.line-h .lm{text-align:right}
.tots{display:grid;gap:8px;max-width:420px;margin-left:auto}
.tots .tr{display:flex;justify-content:space-between;gap:20px;align-items:baseline}
.tots .big{font-weight:900;font-stretch:75%;font-size:22px;border-top:2px solid var(--fg);padding-top:10px;margin-top:4px}
@media (max-width:699px){.line{grid-template-columns:1fr 1fr}.line .ldet{grid-column:1/-1}.line-h{display:none}.line .lm{text-align:left}.line button{justify-self:start}}

/* ===== Animations et composants du nouveau CRM ===== */
#main{transition:opacity .2s ease,filter .2s ease,transform .2s ease}
#main.leaving{opacity:0;filter:blur(6px);transform:translateY(-8px)}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
.enter [data-reveal]{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + 80ms)}
@keyframes wordUp{from{transform:translateY(112%)}to{transform:none}}
.hero .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.07em;margin-right:.22em}
.hero .w>span{display:inline-block}
.enter .hero .w>span{animation:wordUp 1s var(--ease) both;animation-delay:calc(var(--j,0)*110ms + 90ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter .bars i{transform-origin:bottom;animation:grow 1.1s var(--ease) both;animation-delay:calc(var(--i,0)*80ms + 500ms)}
.enter .meter i{transform-origin:left;animation:growX 1.2s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 450ms)}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}

.btn{transition:transform .35s var(--ease),filter .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.rows .row{transition:background .2s,padding .4s var(--ease)}
.rows .row.clickable:hover{padding-left:12px}
.card{transition:transform .4s var(--ease),border-color .2s,box-shadow .4s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(0,0,0,.4)}
.doc{transition:transform .4s var(--ease),border-color .2s,box-shadow .4s}
.doc:hover{transform:translateY(-3px);border-color:var(--fg)}
tbody tr td{transition:background .2s}
.kpi{position:relative;transition:background .3s}
.kpi:hover{background:var(--hover)}
.kpi.hot:hover{background:var(--accent)}
.kpi .dotp{position:absolute;right:14px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--accent-fg);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,10,10,.45)}100%{box-shadow:0 0 0 12px rgba(10,10,10,0)}}

/* Carte « prochaine action » */
.dash{display:grid;grid-template-columns:1fr;gap:28px;margin-bottom:34px}
@media (min-width:900px){.dash{grid-template-columns:1.1fr 1fr}}
.next{position:relative;overflow:hidden;background:var(--fg);color:var(--bg);padding:24px;display:flex;flex-direction:column;gap:14px;min-height:340px;min-width:0}
.next .label{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.next h3{margin:0;font-weight:900;font-stretch:75%;font-size:clamp(30px,4.4vw,50px);line-height:.94;text-transform:uppercase;overflow-wrap:anywhere}
.next .when{display:flex;align-items:center;gap:10px}
.next .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulseS 1.8s infinite;flex:none}
@keyframes pulseS{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 65%,transparent)}100%{box-shadow:0 0 0 13px transparent}}
.next .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);align-self:flex-start}
.next .after{margin-top:auto;border-top:1px solid color-mix(in srgb,var(--bg) 24%,transparent);position:relative}
.next .arow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--bg) 16%,transparent);cursor:pointer;transition:padding .4s var(--ease)}
.next .arow:hover{padding-left:10px}
.next .arow span:first-child{font-weight:700;overflow-wrap:anywhere}
.next .mark{position:absolute;right:20px;top:20px;width:46px;height:46px;color:var(--accent);animation:breathe 4s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-5px)}}
.next>*{position:relative}
.next>.mark{position:absolute}

/* Jauges par étape */
.meters{display:grid;gap:2px;margin-top:6px}
.mrow{display:grid;grid-template-columns:minmax(96px,150px) 1fr 34px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;transition:padding .4s var(--ease)}
.mrow:hover{padding-left:8px}
.mrow .track{height:10px;background:var(--hover);position:relative;overflow:hidden}
.mrow .meter{position:absolute;inset:0}
.mrow .meter i{display:block;height:100%;background:var(--fg)}
.mrow.hotr .meter i{background:var(--accent)}
.mrow .c{text-align:right}

/* Tuiles d'accès aux panneaux */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:34px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:158px;padding:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer;overflow:hidden;color:var(--fg);transition:transform .5s var(--ease),border-color .25s,box-shadow .5s}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--accent) 24%,transparent),transparent 62%);opacity:0;transition:opacity .4s;pointer-events:none}
.tile::after{content:"";position:absolute;inset:16px;pointer-events:none;opacity:0;transition:opacity .35s,inset .5s var(--ease);background:linear-gradient(var(--accent),var(--accent)) 0 0/14px 2px,linear-gradient(var(--accent),var(--accent)) 0 0/2px 14px,linear-gradient(var(--accent),var(--accent)) 100% 0/14px 2px,linear-gradient(var(--accent),var(--accent)) 100% 0/2px 14px,linear-gradient(var(--accent),var(--accent)) 0 100%/14px 2px,linear-gradient(var(--accent),var(--accent)) 0 100%/2px 14px,linear-gradient(var(--accent),var(--accent)) 100% 100%/14px 2px,linear-gradient(var(--accent),var(--accent)) 100% 100%/2px 14px;background-repeat:no-repeat}
.tile:hover{transform:translateY(-5px);border-color:var(--fg);box-shadow:0 18px 32px -16px rgba(0,0,0,.45)}
.tile:hover::before{opacity:1}
.tile:hover::after{opacity:1;inset:8px}
.tile>*{position:relative}
.tile .idx{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.08em}
.tile h3{margin:2px 0 0;font-weight:800;font-stretch:75%;font-size:20px;text-transform:uppercase}
.tile b{display:block;margin-top:auto;font-weight:900;font-stretch:75%;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.tile .arrow{position:absolute;right:16px;top:14px;font-size:20px;transition:transform .5s var(--ease),color .2s}
.tile:hover .arrow{transform:translate(5px,-5px);color:var(--accent)}

/* Fenêtres et messages */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(34px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.overlay.fresh{animation:fade .3s ease both}
.overlay.fresh .sheet{animation:sheetIn .6s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.toast{animation:toastIn .6s var(--ease) both}

/* Recherche rapide ⌘K */

/* ============ Stockage partagé : Supabase (tes appareils voient les mêmes données) ============ */
function cloudDb(){
  const subs={},last={},cache={};
  const tbl=c=>"/rest/v1/crm_"+c;
  async function load(c){
    try{
      const rows=await sbFetch(tbl(c)+"?select=id,data");
      const list=rows||[],key=JSON.stringify(list);
      cache[c]=Object.fromEntries(list.map(r=>[r.id,r.data]));
      if(key===last[c])return;
      last[c]=key;
      const snap={docs:list.map(r=>({id:r.id,exists:true,data:()=>JSON.parse(JSON.stringify(r.data))}))};
      (subs[c]||[]).forEach(cb=>cb(snap));
    }catch(e){
      if(!sbSession())renderGate();
      else toast("Synchronisation : "+e.message);
    }
  }
  const save=async(c,id,data)=>{
    await sbFetch(tbl(c)+"?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id,data:JSON.parse(JSON.stringify(data))})});
    await load(c);
  };
  return{
    refreshAll:()=>COLS.forEach(load),
    collection(c){return{
      onSnapshot(cb){(subs[c]||=[]).push(cb);load(c);return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==cb)}},
      doc(id){return{
        set:async d=>{await save(c,id,d)},
        update:async d=>{await save(c,id,{...(cache[c]?.[id]||{}),...d})},
        delete:async()=>{await sbFetch(tbl(c)+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}});await load(c)}
      }}
    }}}
  ;
}
function cloudAssets(){
  const B="/storage/v1/object/crm-files/";
  return{
    upload:async blob=>{
      const id=uid()+uid(),type=blob.type||"application/octet-stream";
      await sbFetch(B+id,{method:"POST",headers:{"Content-Type":type},body:blob});
      return{id,sizeBytes:blob.size,contentType:type};
    },
    delete:async id=>{await sbFetch(B+id,{method:"DELETE"});return{deleted:true}},
    signedUrl:async id=>{
      const r=await sbFetch("/storage/v1/object/sign/crm-files/"+id,{method:"POST",body:JSON.stringify({expiresIn:3600})});
      return SB.url+"/storage/v1"+r.signedURL;
    },
    get:async()=>null
  };
}
function renderGate(){
  const nav=$("#nav");if(nav)nav.hidden=true;
  $("#main").innerHTML=`<h1>Connexion</h1><p class="lede">Ton CRM est partagé entre tes appareils. Connecte-toi avec le code reçu par email.</p>`+sbLoginHtml();
  $("#modal").innerHTML="";
}
async function migrateLocal(){
  let n=0;
  for(const c of COLS){
    if(c==="documents")continue;
    let o={};try{o=JSON.parse(localStorage.getItem("crmmaxis:"+c)||"{}")}catch(_){}
    for(const [id,d] of Object.entries(o)){
      if(S[c].has(id))continue;
      await put(c,id,d);n++;
    }
  }
  toast(n?n+" élément(s) copié(s) dans ta base partagée":"Rien à copier : ce navigateur ne contient pas de données");
}

/* ============ Stockage : Claude (si disponible) ou navigateur (Netlify, poste local) ============ */
function localDb(){
  const key=c=>"crmmaxis:"+c;
  const read=c=>{try{return JSON.parse(localStorage.getItem(key(c))||"{}")}catch(_){return {}}};
  const write=(c,o)=>{try{localStorage.setItem(key(c),JSON.stringify(o))}catch(e){throw new Error("Stockage plein dans le navigateur : exporte une sauvegarde puis supprime des documents.")}};
  const subs={};
  const snapOf=c=>({docs:Object.entries(read(c)).map(([id,d])=>({id,exists:true,data:()=>JSON.parse(JSON.stringify(d))}))});
  const emit=c=>(subs[c]||[]).forEach(cb=>cb(snapOf(c)));
  window.addEventListener("storage",e=>{if(e.key&&e.key.startsWith("crmmaxis:"))emit(e.key.slice(9))});
  return{collection(c){return{
    onSnapshot(cb){(subs[c]||=[]).push(cb);setTimeout(()=>cb(snapOf(c)),0);return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==cb)}},
    doc(id){return{
      set:async d=>{const o=read(c);o[id]=JSON.parse(JSON.stringify(d));write(c,o);emit(c)},
      update:async d=>{const o=read(c);o[id]={...(o[id]||{}),...JSON.parse(JSON.stringify(d))};write(c,o);emit(c)},
      delete:async()=>{const o=read(c);delete o[id];write(c,o);emit(c)}}}}}}
}
function localAssets(){
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open("crmmaxis-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const run=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction("files",mode);const req=fn(t.objectStore("files"));t.oncomplete=()=>{db.close();res(req?req.result:true)};t.onerror=()=>rej(t.error)})};
  return{
    upload:async blob=>{const id=uid()+uid();await run("readwrite",st=>st.put(blob,id));return{id,sizeBytes:blob.size,contentType:blob.type||"application/octet-stream"}},
    delete:async id=>{await run("readwrite",st=>st.delete(id));return{deleted:true}},
    get:async id=>run("readonly",st=>st.get(id))
  };
}

async function boot(){
  if(sbFromHash())view="demandes";
  const hasClaude=!!window.claude;
  if(hasClaude){
    try{dbRef=await window.claude.use("db")}catch(_){dbRef=null}
    try{assetsRef=await window.claude.use("assets")}catch(_){assetsRef=null}
    if(!dbRef){$("#main").innerHTML=`<div class="empty"><h2>Base indisponible</h2>La base n'est pas accessible dans cette vue. Ouvre la page depuis ton compte MAXIS.</div>`;return}
  }else{
    LOCAL=true;
    if(!sbSession()){renderGate();return}
    CLOUD=true;const cdb=cloudDb();dbRef=cdb;assetsRef=cloudAssets();
    setInterval(cdb.refreshAll,20000);window.addEventListener("focus",cdb.refreshAll);
  }
  COLS.forEach(c=>{
    dbRef.collection(c).onSnapshot(snap=>{
      S[c]=new Map(snap.docs.filter(d=>d.exists).map(d=>[d.id,{...d.data(),id:d.id}]));
      scheduleRender();
    },e=>toast("Synchronisation : "+(e.message||e.code)));
  });
  applyTheme();
  render();
}
async function put(col,id,data){
  const body={...data};delete body.id;
  S[col].set(id,{...body,id});
  try{await dbRef.collection(col).doc(id).set(JSON.parse(JSON.stringify(body)))}
  catch(e){toast("Enregistrement impossible : "+(e.message||e.code));throw e}
}
async function del(col,id){
  S[col].delete(id);
  try{await dbRef.collection(col).doc(id).delete()}catch(e){toast("Suppression impossible : "+(e.message||e.code))}
}

/* ============ Thème (préférence locale au visiteur) ============ */
const THEMES=["auto","clair","sombre"];
function themeNow(){try{return localStorage.getItem("crmmaxis:theme")||"auto"}catch(_){return"auto"}}
const ICON_THEME={
  auto:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg>',
  clair:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',

const VIEWS={accueil,pipeline,entreprises,demandes,facturation,documents,reglages};
let lastView=null,animNext=true,rT=null;
const CNT=new Map();
const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
function scheduleRender(){clearTimeout(rT);rT=setTimeout(render,40)}
function syncNav(){
  document.querySelectorAll(".nav button").forEach(b=>{
    b.dataset.view===view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current");
  });
  placeInd();
}
function placeInd(){
  const n=$("#nav"),ind=$("#ind"),a=n&&n.querySelector('[aria-current="page"]');
  if(!a||!ind)return;
  ind.style.left=a.offsetLeft+"px";ind.style.width=a.offsetWidth+"px";
  if(n.scrollWidth>n.clientWidth)n.scrollTo({left:Math.max(0,a.offsetLeft-24),behavior:reduceMotion()?"auto":"smooth"});
  if(!ind.classList.contains("ready"))requestAnimationFrame(()=>requestAnimationFrame(()=>ind.classList.add("ready")));
}
window.addEventListener("resize",placeInd);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInd);
function runCounts(first){
  document.querySelectorAll("#main [data-count]").forEach(el=>{
    const to=Number(el.dataset.count)||0,k=view+":"+el.dataset.k,from=first?0:(CNT.get(k)??to);
    CNT.set(k,to);
    const f=v=>el.dataset.fmt==="eur"?fmtEur(v):el.dataset.fmt==="pct"?Math.round(v)+" %":String(Math.round(v));
    if(reduceMotion()||from===to){el.textContent=f(to);return}
    const d=first?1300:700,t0=performance.now()+(first?350:0);
    el.textContent=f(from);
    const step=now=>{const p=Math.max(0,Math.min(1,(now-t0)/d)),e=p>=1?1:1-Math.pow(2,-10*p);el.textContent=f(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function render(){
  const m=$("#main");if(!m)return;
  syncNav();
  const t=today(),due=[...S.entreprises.values()].filter(c=>c.dateProchaineAction&&c.dateProchaineAction<=t&&c.statut!=="Perdu").length;
  const bn=$("#bellN");if(bn){bn.textContent=due;bn.hidden=!due}
  if(view!==lastView){lastView=view;animNext=true}
  m.innerHTML=VIEWS[view]();
  if(view!=="accueil"&&animNext)[...m.children].forEach(c=>c.setAttribute("data-reveal",""));
  m.classList.remove("leaving");
  m.classList.toggle("enter",animNext&&!reduceMotion());
  if(animNext)m.querySelectorAll("[data-reveal]").forEach((e,i)=>e.style.setProperty("--i",i));
  if(view==="entreprises")paintRows();
  if(view==="facturation")paintFac();
  if(view==="documents")paintDocs();
  if(view==="demandes")paintDemandes();
  runCounts(animNext);
  animNext=false;
}

}

function daysTo(d){const a=new Date(today()+"T12:00:00"),b=new Date(d+"T12:00:00");return Math.round((b-a)/864e5)}
function whenTxt(d){const n=daysTo(d);return n<0?`En retard de ${-n} j`:n===0?"Aujourd'hui":n===1?"Demain":`Dans ${n} j`}
function accueil(){
  const cos=[...S.entreprises.values()],t=today();
  const enCours=cos.filter(c=>EN_COURS.includes(c.statut)).length;
  const relances=cos.filter(c=>c.dateProchaineAction&&c.dateProchaineAction<=t&&c.statut!=="Perdu");
  const gagnes=cos.filter(c=>GAGNES.includes(c.statut)).length,perdus=cos.filter(c=>c.statut==="Perdu").length;
  const conv=gagnes+perdus?Math.round(gagnes/(gagnes+perdus)*100):0;
  const allFacs=[...S.factures.values()],facs=allFacs.filter(f=>!isDevisDoc(f));
  const encaisse=sumBy(facs.filter(f=>f.statut==="Payée"),"montant");
  const attente=sumBy(facs.filter(f=>f.statut==="Envoyée"),"montant");
  const pipe=sumBy([...S.affaires.values()].filter(a=>a.statut==="En négociation"),"montant");
  const h=new Date().getHours(),hello=h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir";
  if(!cos.length)return `<h1>${hello}</h1><p class="lede">Le CRM est prêt. Commence par ajouter une entreprise.</p>`+empty("Aucune entreprise pour l'instant","Ajoute ta première entreprise avec « + Entreprise ». Contacts, échanges, affaires, devis, factures et documents se rattachent ensuite à sa fiche.")+`<p style="margin-top:18px"><button class="btn acc" data-act="newCo">+ Ajouter une entreprise</button></p>`;
  const aFaire=cos.filter(c=>c.dateProchaineAction&&c.statut!=="Perdu").sort((a,b)=>a.dateProchaineAction>b.dateProchaineAction?1:-1);
  const first=aFaire[0],after=aFaire.slice(1,5);
  const acts=byKey(S.activites,"date",-1).slice(0,6);
  const months=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),l:d.toLocaleDateString("fr-FR",{month:"short"}).replace(".",""),v:0,cur:i===0})}

      <div class="meters">${byStat.map((b,i)=>`<button class="mrow ${b.n&&EN_COURS.includes(b.x)?"hotr":""}" data-act="view" data-view="pipeline" style="--i:${i}" aria-label="${esc(b.x)} : ${b.n}"><span class="label">${esc(b.x)}</span><span class="track"><span class="meter"><i style="width:${Math.max(b.n?4:0,b.n/mx*100)}%"></i></span></span><span class="num c"><strong>${b.n}</strong></span></button>`).join("")}</div>

/* Devis et factures : ajoutés automatiquement à la liste des documents (toujours à jour, sans doublon) */
function docsAll(){
  const gen=[...S.factures.values()].map(f=>{
    const dev=isDevisDoc(f),p=(f.lignes||[]).map(l=>l.designation).filter(Boolean).join(", ");
    return{gen:true,id:f.id,nom:f.numero+(p?" — "+p:""),numero:f.numero,categorie:dev?"Devis":"Facture",sousType:f.type,entrepriseId:f.entrepriseId,ajouteLe:f.date,montant:Number(f.montant)||0,statut:statutNorm(f),devis:dev};
  });
  return [...S.documents.values(),...gen];
}
function paintDocs(){
  const box=$("#docs");if(!box)return;
  const needle=UI.docQ.trim().toLowerCase();
  const min=UI.docMin===""?null:Number(UI.docMin),max=UI.docMax===""?null:Number(UI.docMax);
  const money=min!==null||max!==null||UI.docStat;
  const all=docsAll();
  const list=all.filter(d=>{
    if(UI.docCat&&d.categorie!==UI.docCat)return false;
    if(UI.docCo&&d.entrepriseId!==UI.docCo)return false;
    if(money&&!d.gen)return false;
    if(UI.docStat&&d.statut!==UI.docStat)return false;
    if(min!==null&&d.montant<min)return false;
    if(max!==null&&d.montant>max)return false;
    if(UI.docFrom&&(d.ajouteLe||"")<UI.docFrom)return false;
    if(UI.docTo&&(d.ajouteLe||"")>UI.docTo)return false;
    if(needle){
      const hay=[d.nom,d.numero,d.entrepriseId?coName(d.entrepriseId):"",d.gen?String(d.montant).replace(".",","):"",d.gen?String(d.montant):""].join(" ").toLowerCase();
      if(!hay.includes(needle))return false;
    }
    return true;
  });
  const cmp={date:(a,b)=>(b.ajouteLe||"")>(a.ajouteLe||"")?1:-1,montant:(a,b)=>(b.montant||0)-(a.montant||0),montantAsc:(a,b)=>(a.montant??Infinity)-(b.montant??Infinity),entreprise:(a,b)=>(a.entrepriseId?coName(a.entrepriseId):"~").localeCompare(b.entrepriseId?coName(b.entrepriseId):"~","fr")}[UI.docSort]||(()=>0);
  list.sort(cmp);
  if(!all.length){box.innerHTML=empty("Aucun document","Les devis et factures créés apparaissent ici automatiquement. Ajoute aussi un fichier avec le formulaire ci-dessus.");return}
  const total=sumBy(list.filter(d=>d.gen),"montant"),nbG=list.filter(d=>d.gen).length;
  box.innerHTML=(list.length?`<p class="label" style="margin:14px 0 4px">${list.length} document${list.length>1?"s":""}${nbG?` · dont ${nbG} devis/facture${nbG>1?"s":""} pour ${fmtEur(total)} HT`:""}</p><div class="docs">${list.map(docCard).join("")}</div>`:`<p class="label" style="padding:18px 0">Aucun document ne correspond au filtre.</p>`);
}
function docCard(d){
  const c=d.entrepriseId?coName(d.entrepriseId):"Interne";
  if(d.gen)return `<article class="doc">
    <span class="tag">${esc(d.categorie)}</span>
    <strong>${esc(d.nom)}</strong>
    <div class="label">${esc(c)} · ${fmtDate(d.ajouteLe)} · ${esc(statutLabel(d.statut,d.devis))}</div>
    <div class="num"><strong>${fmtEur(d.montant)}</strong> HT</div>
    <div class="acts"><button class="btn ghost sm" data-act="printFac" data-id="${d.id}">Ouvrir / imprimer</button></div></article>`;
  return `<article class="doc">
    <span class="tag">${esc(d.categorie)}</span>
    <strong>${esc(d.nom)}</strong>
    <div class="label">${esc(c)} · ${fmtDate(d.ajouteLe)}${d.taille?" · "+fmtSize(d.taille):""}</div>

function sbFromHash(){
  const h=new URLSearchParams(location.hash.slice(1)),at=h.get("access_token");
  if(!at)return false;
  sbSave({access_token:at,refresh_token:h.get("refresh_token"),expires_at:Date.now()+(+h.get("expires_in")||3600)*1000});
  history.replaceState(null,"",location.pathname+location.search);

async function sbRefresh(){
  const s=sbSession();if(!s?.refresh_token)return false;
  try{
    const r=await fetch(SB.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok){sbSave(null);return false}
    const j=await r.json();
    sbSave({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+j.expires_in*1000});
    return true;
  }catch(_){return false}
}
async function sbFetch(path,opts={},retry=true){
  const s=sbSession();
  const headers={apikey:SB.key,"Content-Type":"application/json",...(opts.headers||{})};
  if(s?.access_token)headers.Authorization="Bearer "+s.access_token;
  const r=await fetch(SB.url+path,{...opts,headers});
  if(r.status===401&&retry&&await sbRefresh())return sbFetch(path,opts,false);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();
  return t?JSON.parse(t):null;
}

function commissions(id){
  const c=co(id)||{},t=APP_TAUX[c.apporteurType]||{app:0,alpha:0};
  const payees=[...S.factures.values()].filter(f=>f.entrepriseId===id&&f.type!=="Devis"&&f.statut==="Payée");
  const base=Math.round(payees.reduce((s,f)=>s+(Number(f.montant)||0),0)*100)/100;
  const soldeOk=payees.some(f=>!/acompte/i.test(f.type));
  const du=v=>soldeOk?Math.round(base*v)/100:0;
  return {t,base,soldeOk,app:du(t.app),alpha:du(t.alpha),nom:c.apporteurNom||""};
}

  const type=c.apporteurType||APPORTEURS[0];

function lineRow(l={}){
  const d=document.createElement("div");d.className="line";
  d.innerHTML=`<input class="ld" aria-label="Désignation" placeholder="Désignation" value="${esc(l.designation||"")}">
    <input class="ldet" aria-label="Détail" placeholder="Détail (facultatif)" value="${esc(l.detail||"")}">
    <input class="lq" type="number" min="0" step="0.5" aria-label="Quantité" value="${l.qte??1}">
    <input class="lpu" type="number" min="0" step="0.01" aria-label="Prix unitaire HT" placeholder="0,00" value="${l.pu??""}">
    <span class="lm num">${fmtEur((l.qte??1)*(l.pu||0))}</span>
    <button class="btn ghost sm" data-act="delLine" aria-label="Retirer la ligne">Retirer</button>`;
  return d;

function readLines(){
  return [...document.querySelectorAll("#lignes .line")].map(r=>({designation:r.querySelector(".ld").value.trim(),detail:r.querySelector(".ldet").value.trim(),qte:Number(r.querySelector(".lq").value)||0,pu:Number(r.querySelector(".lpu").value)||0})).filter(l=>l.designation||l.pu);
}
function updTotaux(){
  const box=$("#totaux");if(!box||modal?.kind!=="fac")return;
  const type=$("#fa-type").value,isAc=/acompte|solde/i.test(type);
  const pct=type.includes("30")?30:type.includes("70")?70:100;
  const isDev=type==="Devis";
  const st=$("#fa-statut"),want=isDev?STATUT_DEV:STATUT_FAC;
  if(st.options.length!==want.length){const cur=st.value;st.innerHTML=statutOpts(want,want.includes(cur)?cur:"Brouillon",isDev)}
  $("#fa-remise").disabled=isAc;
  $("#sec-lignes").hidden=isAc;
  $("#fa-aff-w").hidden=!isDev;
  $("#fa-dev-w").hidden=isDev;
  document.querySelectorAll("#lignes .line").forEach(r=>{r.querySelector(".lm").textContent=fmtEur((Number(r.querySelector(".lq").value)||0)*(Number(r.querySelector(".lpu").value)||0))});
  if(isAc){
    const o=$("#fa-dev").selectedOptions[0];
    const base=Number(o?.dataset.m)||0,montant=Math.round(base*pct)/100;
    box.innerHTML=`<div class="tr"><span>Total HT du devis</span><span class="num">${fmtEur(base)}</span></div>
      <div class="tr"><span>${pct} % du devis</span><span class="num">${fmtEur(montant)}</span></div>
      <div class="tr big"><span>Montant HT</span><span class="num">${fmtEur(montant)}</span></div>`;
    return;
  }
  const brut=readLines().reduce((s,l)=>s+l.qte*l.pu,0);
  const rp=Math.min(100,Math.max(0,Number($("#fa-remise").value)||0));
  const remise=Math.round(brut*rp)/100,montant=Math.round((brut-remise)*100)/100;
  box.innerHTML=`<div class="tr"><span>Sous-total HT</span><span class="num">${fmtEur(brut)}</span></div>
    ${remise>0?`<div class="tr"><span>Remise client ${rp} %</span><span class="num">− ${fmtEur(remise)}</span></div>`:""}
    <div class="tr big"><span>Total HT</span><span class="num">${fmtEur(montant)}</span></div>`;
}
function addLineRow(l){$("#lignes").appendChild(lineRow(l));updTotaux()}
function coPick(){
  const o=$("#fa-co").selectedOptions[0],coId=o?.value||"";
  if(coId)$("#fa-remise").value=o.dataset.remise||0;
  const keepAff=$("#fa-aff").value;
  $("#fa-aff").innerHTML=affOptions(coId);
  if(keepAff&&S.affaires.get(keepAff)?.entrepriseId===coId)$("#fa-aff").value=keepAff;
  $("#fa-dev").innerHTML=devisOptions(coId);
  updTotaux();
}
function affPick(){
  const o=$("#fa-aff").selectedOptions[0];
  if(o&&o.value){
    if($("#fa-co").value!==o.dataset.co){$("#fa-co").value=o.dataset.co;coPick();$("#fa-aff").value=o.value}
    $("#lignes").innerHTML="";$("#lignes").appendChild(lineRow({designation:o.dataset.p,qte:1,pu:Number(o.dataset.m)||0}));
  }
  updTotaux();
}
function devPick(){
  const d=S.factures.get($("#fa-dev").value);
  if(d&&!/acompte|solde/i.test($("#fa-type").value)){
    $("#lignes").innerHTML="";
    for(const l of (d.lignes||[]))$("#lignes").appendChild(lineRow(l));
    $("#fa-remise").value=Number(d.remisePct)||0;
  }
  updTotaux();
}
function calcFac(){if($("#fa-type").value!=="Devis"&&$("#fa-dev").value)devPick();else updTotaux()}
async function saveFac(){
  const type=$("#fa-type").value,entrepriseId=$("#fa-co").value,isAc=/acompte|solde/i.test(type);
  if(!entrepriseId){toast("Choisis l'entreprise");return}
  const isDev=type==="Devis";
  let affaireId=null,devisId=null,devOpt=null;
  if(isDev)affaireId=$("#fa-aff").value||null;
  else{
    devOpt=$("#fa-dev").selectedOptions[0];devisId=devOpt?.value||null;
    if(!devisId){toast("Choisis le devis : la facture se fabrique à partir de lui");return}
    affaireId=devOpt.dataset.aff||null;
  }
  let lignes,brut,remisePct=0,remise=0,montant,base=null,pct=null;
  if(isAc){
    pct=type.includes("30")?30:70;
    base=Number(devOpt.dataset.m)||0;
    montant=Math.round(base*pct)/100;
    if(!(montant>0)){toast("Ce devis n'a pas de montant");return}
    const label=type.startsWith("Facture d'acompte")?"Acompte":"Solde";
    const dv=S.factures.get(devisId);
    lignes=[{designation:`${label} ${pct} % — ${dv?.numero?"devis "+dv.numero+" — ":""}${devOpt.dataset.p}`,detail:"",qte:1,pu:montant}];
    brut=montant;
  }else{
    lignes=readLines();
    if(!lignes.length){toast("Ajoute au moins une ligne");return}
    brut=lignes.reduce((s,l)=>s+l.qte*l.pu,0);
    remisePct=Math.min(100,Math.max(0,Number($("#fa-remise").value)||0));
    remise=Math.round(brut*remisePct)/100;
    montant=Math.round((brut-remise)*100)/100;
    if(!(montant>0)){toast("Le montant doit être supérieur à 0");return}
  }
  await put("factures",uid(),{numero:nextNumero(type),type,entrepriseId,affaireId,devisId,date:$("#fa-date").value||today(),statut:$("#fa-statut").value,lignes,brut:Math.round(brut*100)/100,remisePct,remise,montant,base,pct});
  closeModal();toast("Document créé");
}

let pal=null;
const PANELS=[["accueil","Accueil"],["pipeline","Pipeline"],["entreprises","Entreprises"],["demandes","Demandes du site"],["facturation","Devis & factures"],["documents","Documents"],["reglages","Réglages"]];
function palItems(){
  const q=(pal.q||"").trim().toLowerCase(),out=[];
  const has=x=>!q||x.toLowerCase().includes(q);
  const actions=[["Nouvelle entreprise",()=>openModal("co",null)],["Nouveau devis ou facture",()=>openModal("fac",null)]];
  actions.filter(a=>has(a[0])).forEach(a=>out.push({sec:"Actions",label:a[0],hint:"créer",run:a[1]}));
  PANELS.filter(p=>has(p[1])).forEach(p=>out.push({sec:"Panneaux",label:p[1],hint:"ouvrir",run:()=>gotoView(p[0])}));
  [...S.entreprises.values()].filter(c=>has((c.nom||"")+" "+(c.ville||"")+" "+(c.secteur||""))).sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr")).slice(0,q?12:6)
    .forEach(c=>out.push({sec:"Entreprises",label:c.nom||"Sans nom",hint:[c.ville,c.statut].filter(Boolean).join(" · "),run:()=>openModal("co",c.id)}));
  return out;
}
function openPalette(){
  if(pal)return;pal={q:"",i:0,items:[]};
  $("#pal").innerHTML=`<div class="pal" data-act="palbg"><div class="pal-box" role="dialog" aria-modal="true" aria-label="Recherche rapide">
    <input id="pal-q" type="text" placeholder="Rechercher une entreprise, un panneau, une action…" autocomplete="off" aria-label="Recherche rapide">
    <div class="pal-list" id="pal-list" role="listbox"></div></div></div>`;
  $("#pal-q").addEventListener("input",e=>{pal.q=e.target.value;pal.i=0;paintPal()});
  paintPal();setTimeout(()=>$("#pal-q")?.focus(),30);
}
function closePalette(){if(!pal)return;pal=null;$("#pal").innerHTML=""}
function paintPal(){
  if(!pal)return;
  pal.items=palItems();let sec="";
  $("#pal-list").innerHTML=pal.items.length?pal.items.map((it,i)=>{
    const h=it.sec!==sec?`<div class="pal-sec label">${it.sec}</div>`:"";sec=it.sec;
    return h+`<div class="pal-item" role="option" data-pi="${i}" aria-selected="${i===pal.i}"><strong>${esc(it.label)}</strong><span class="label">${esc(it.hint||"")}</span></div>`}).join("")
    :`<p class="label" style="padding:18px">Aucun résultat.</p>`;
  $("#pal-list").querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});
}
function palRun(i){const it=pal?.items[i];if(!it)return;closePalette();it.run()}
document.addEventListener("click",e=>{
  if(!pal)return;
  const bg=e.target.closest(".pal");const item=e.target.closest(".pal-item");
  if(item){palRun(+item.dataset.pi);return}
  if(bg&&!e.target.closest(".pal-box"))closePalette();
},true);
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal?closePalette():openPalette();return}
  if(!pal)return;
  if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closePalette();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const n=pal.items.length||1;pal.i=(pal.i+(e.key==="ArrowDown"?1:n-1))%n;paintPal()}
  if(e.key==="Enter"){e.preventDefault();palRun(pal.i)}
},true);
(()=>{const k=$("#kbd");if(k&&!/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent))k.textContent="Ctrl K"})();

async function uploadDoc(input){
  const file=input.files?.[0];if(!file)return;
  const box=input.closest(".box");
  const categorie=box.querySelector(".up-cat").value,entrepriseId=box.querySelector(".up-co").value||null;
  if(!assetsRef){toast("Stockage indisponible");return}
  toast("Envoi de « "+file.name+" »…");
  try{
    const up=await assetsRef.upload(file);
    await put("documents",uid(),{nom:file.name,categorie,entrepriseId,assetId:up.id,type:up.contentType,taille:up.sizeBytes,ajouteLe:today()});
    toast("Document ajouté");
  }catch(e){
    toast(e.code==="unsupported_type"?"Format non accepté. Convertis le fichier en PDF.":e.code==="too_large"?"Fichier trop lourd (20 Mo max).":"Envoi impossible : "+(e.message||e.code));
  }
  input.value="";
  if(modal)paintModal();
}
async function openDoc(id){
  if(!LOCAL)return;
  if(CLOUD){const u=await assetsRef.signedUrl(id);if(!u){toast("Fichier introuvable");return}window.open(u,"_blank","noopener");return}
  const blob=await assetsRef.get(id);
  if(!blob){toast("Fichier introuvable dans ce navigateur");return}
  const u=URL.createObjectURL(blob);
  window.open(u,"_blank","noopener");
}
function download(name,text){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportAll(){
  const out={exporteLe:new Date().toISOString(),version:1};
  for(const c of COLS)out[c]=Object.fromEntries([...S[c]].map(([id,d])=>{const b={...d};delete b.id;return[id,b]}));
  download("crm-maxis-"+today()+".json",JSON.stringify(out,null,2));
  toast("Sauvegarde téléchargée");
}
async function importAll(input){
  const f=input.files?.[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    let n=0;
    for(const c of COLS){for(const [id,d] of Object.entries(data[c]||{})){await put(c,id,d);n++}}
    toast(n+" enregistrements importés");
  }catch(e){toast("Fichier de sauvegarde invalide")}
  input.value="";
}
async function saveReglages(){
  const g=n=>($("#r-"+n)?.value??"").trim();
  await put("reglages","maxis",{raison:g("raison"),siret:g("siret"),adresse:g("adresse"),email:g("email"),tel:g("tel"),tvaMention:$("#r-tva").value.trim(),statut:g("statut"),rcs:g("rcs")});
  toast("Réglages enregistrés");
}

async function act(a,el,e){
  switch(a){
    case "view": gotoView(el.dataset.view); break;
    case "palette": openPalette(); break;
    case "theme": {const i=(THEMES.indexOf(themeNow())+1)%THEMES.length;try{localStorage.setItem("crmmaxis:theme",THEMES[i])}catch(_){}applyTheme();break}
    case "bgclose": if(e.target===el)closeModal(); break;
    case "close": closeModal(); break;
    case "newCo": openModal("co",null); break;
    case "openCo": closePalette(); openModal("co",el.dataset.id); break;
    case "saveCo": await saveCo(); break;
    case "delCo": if(armed(el))await delCo(modal.id); break;
    case "addContact": await addContact(); break;
    case "addAct": await addAct(); break;
    case "addAff": await addAff(); break;
    case "delRec": if(armed(el)){await del(el.dataset.col,el.dataset.id);paintModal()} break;
    case "newFac": openModal("fac",null); break;
    case "saveFac": await saveFac(); break;
    case "addLine": addLineRow({qte:1,pu:""}); break;
    case "delLine": el.closest(".line")?.remove(); updTotaux(); break;
    case "printFac": printFac(el.dataset.id); break;
    case "delFac": if(armed(el))await del("factures",el.dataset.id); break;
    case "openDoc": if(LOCAL){e.preventDefault();await openDoc(el.dataset.asset)} break;
    case "delDoc":
      if(!armed(el))break;
      if(assetsRef){try{await assetsRef.delete(el.dataset.asset)}catch(err){toast("Fichier non supprimé : "+(err.message||err.code));break}}
      await del("documents",el.dataset.id);
      if(modal)paintModal();
      break;
    case "saveReglages": await saveReglages(); break;
    case "sbLogin": {const m=($("#sb-mail")?.value||"maxiscomfr@gmail.com").trim();try{await sbSendLink(m);sbCodeSent=true;sbMail=m;toast("Code envoyé par email");renderGate()}catch(err){toast(err.status===429?"Trop de demandes. Attends 5 minutes puis réessaie une seule fois.":"Envoi impossible : "+err.message)}break}
    case "sbVerify": {const c=($("#sb-code")?.value||"").replace(/\s/g,"");if(!c){toast("Saisis le code reçu");break}try{await sbVerifyCode(sbMail,c);sbCodeSent=false;toast("Connecté");location.reload()}catch(err){toast("Code refusé ou expiré. Demande-en un nouveau.")}break}
    case "sbLogout": sbSave(null); location.reload(); break;
    case "migrateLocal": await migrateLocal(); break;
    case "convertDemande": await convertDemande(el.dataset.id); break;
    case "pushOn": await pushOn(); break;
    case "ignoreDemande": await ignoreDemande(el.dataset.id); break;
    case "exportAll": exportAll(); break;
  }
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-act='openDoc']");
  if(d){act("openDoc",d,e);return}
  if(e.target.closest("select,input,textarea,label"))return;
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.tagName==="A"&&el.dataset.act!=="openDoc")return;
  act(el.dataset.act,el,e);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&modal){closeModal();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("[role=button][data-act]")){e.preventDefault();act(e.target.dataset.act,e.target,e)}
});
document.addEventListener("change",async e=>{
  const el=e.target,c=el.dataset?.chg;if(!c)return;
  if(c==="stat"){const x=co(el.dataset.id);if(x)await put("entreprises",x.id,{...x,statut:el.value,misAJour:today()})}
  if(c==="factStat"){const f=S.factures.get(el.dataset.id);if(f)await put("factures",f.id,{...f,statut:el.value})}
  if(c==="affStat"){const f=S.affaires.get(el.dataset.id);if(f){await put("affaires",f.id,{...f,statut:el.value});paintModal()}}
  if(c==="calcFac")calcFac();
  if(c==="coPick")coPick();
  if(c==="affPick")affPick();
  if(c==="devPick")devPick();
  if(c==="upload")await uploadDoc(el);
  if(c==="importAll")await importAll(el);
});
document.addEventListener("input",e=>{if(modal?.kind==="fac")updTotaux()});
/* Glisser-déposer des cartes du pipeline */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.("[data-card]");if(!c)return;dragId=c.dataset.card;e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragover",e=>{const col=e.target.closest?.("[data-drop]");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("dragleave",e=>{const col=e.target.closest?.("[data-drop]");if(col&&!col.contains(e.relatedTarget))col.classList.remove("over")});
document.addEventListener("drop",async e=>{
  const col=e.target.closest?.("[data-drop]");if(!col||!dragId)return;
  e.preventDefault();col.classList.remove("over");
  const x=co(dragId);const s=col.dataset.drop;dragId=null;
  if(x&&x.statut!==s)await put("entreprises",x.id,{...x,statut:s,misAJour:today()});
});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"))});

boot();
</script>
